<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1217">
<title>Backtest · Signal Desk</title>
<style>
:root{--bg:#0d1217;--panel:#151c24;--line:#25303b;--ink:#e8edf2;--dim:#8a98a6;--up:#34c796;--dn:#f0605d;--wait:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px)}
h1{font-size:18px;margin:14px 0 4px}a{color:#6aa9ff;font-size:13px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font-size:14px;width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink);grid-column:1/3}
button{width:100%;background:var(--up);color:#06231a;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:700}
button:disabled{opacity:.5}
#msg{color:var(--dim);font-size:13px;margin:10px 0;min-height:20px}
.card{background:var(--panel);border-radius:8px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g div{background:var(--bg);border-radius:6px;padding:8px}
.g small{display:block;color:var(--dim);font-size:11px}.g b{font-variant-numeric:tabular-nums}
.p{color:var(--up)}.m{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--dim);font-weight:500}td:first-child,th:first-child{text-align:left}
.note{color:var(--dim);font-size:12px;margin:8px 0}
</style>
</head>
<body>
<h1>ব্যাকটেস্ট · 15m</h1>
<a href="index.html">← লাইভ অ্যাপ</a>
<div class="ctl">
<label>পেয়ার<select id="sym"><option value="BTCUSDT">BTC</option><option value="ETHUSDT">ETH</option><option value="PAXGUSDT">সোনা (PAXG)</option></select></label>
<label>সময়কাল<select id="per"><option value="3">৩ মাস</option><option value="6">৬ মাস</option><option value="12" selected>১ বছর</option><option value="24">২ বছর</option><option value="36">৩ বছর</option></select></label>
<label>ন্যূনতম ইন্ডিকেটর মিল<select id="minv"><option>3</option><option>4</option><option>5</option></select></label>
<label>রিওয়ার্ড (RR)<select id="rr"><option value="auto">অটো (2 / 2.5)</option><option value="2">1:2</option><option value="2.5">1:2.5</option><option value="3">1:3</option></select></label>
<label>সর্বোচ্চ লিভারেজ<input id="lev" type="number" value="5" min="1" max="20"></label>
<label>ফি + স্লিপেজ (প্রতি দিক %)<input id="fee" type="number" value="0.12" step="0.01" min="0"></label>
<label class="chk"><input id="nc" type="checkbox" checked> Supertrend-এর বিপরীতে সিগন্যাল বাদ দিন</label>
</div>
<button id="go">ব্যাকটেস্ট চালান</button>
<div id="msg"></div>
<div id="out"></div>
<p class="note">ফলাফলে প্রতি ট্রেডে ব্যালেন্সের ১% রিস্ক ধরা হয়েছে। এন্ট্রি হয় সিগন্যাল ক্যান্ডেলের পরের ক্যান্ডেলের ওপেনে। একই ক্যান্ডেলে SL ও TP দুটোই ছুঁলে SL ধরা হয়। ২৪ ঘণ্টায় কোনোটা না ছুঁলে ক্লোজে বের হয়। অতীতের ফল ভবিষ্যতের নিশ্চয়তা নয়।</p>
<script>
//PURE
const ema=(a,p)=>{const k=2/(p+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
function atr(h,l,c,p){const o=[];let t=0;for(let i=0;i<c.length;i++){const tr=i?Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])):h[i]-l[i];if(i<p){t+=tr;o.push(t/(i+1))}else o.push((o[i-1]*(p-1)+tr)/p)}return o}
function rsiS(c,p){const o=new Array(c.length).fill(50);let g=0,ls=0;for(let i=1;i<=p;i++){const d=c[i]-c[i-1];d>0?g+=d:ls-=d}g/=p;ls/=p;o[p]=ls===0?100:100-100/(1+g/ls);for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+(d>0?d:0))/p;ls=(ls*(p-1)+(d<0?-d:0))/p;o[i]=ls===0?100:100-100/(1+g/ls)}return o}
function stS(h,l,c,a,m){const o=[];let dir=1,fu=0,fl=0;for(let i=0;i<c.length;i++){const hl=(h[i]+l[i])/2,u=hl+m*a[i],lo=hl-m*a[i];if(i===0){fu=u;fl=lo}else{fu=(u<fu||c[i-1]>fu)?u:fu;fl=(lo>fl||c[i-1]<fl)?lo:fl;if(dir===1&&c[i]<fl)dir=-1;else if(dir===-1&&c[i]>fu)dir=1}o.push(dir)}return o}
function prep(K){
  const n=K.length,c=K.map(x=>x.c),h=K.map(x=>x.h),l=K.map(x=>x.l);
  const e9=ema(c,9),e21=ema(c,21),r=rsiS(c,14),m12=ema(c,12),m26=ema(c,26),ml=m12.map((v,i)=>v-m26[i]),ms=ema(ml,9);
  const a14=atr(h,l,c,14),st=stS(h,l,c,atr(h,l,c,10),3),mid=[],up=[],lo=[];
  for(let i=0;i<n;i++){if(i<19){mid.push(c[i]);up.push(c[i]);lo.push(c[i]);continue}let s=0;for(let k=i-19;k<=i;k++)s+=c[k];const m=s/20;let v=0;for(let k=i-19;k<=i;k++)v+=(c[k]-m)**2;const sd=Math.sqrt(v/20);mid.push(m);up.push(m+2*sd);lo.push(m-2*sd)}
  const pH=[],pL=[];
  for(let j=5;j<n-5;j++){let H=true,L=true;for(let k=1;k<=5;k++){if(h[j]<=h[j-k]||h[j]<=h[j+k])H=false;if(l[j]>=l[j-k]||l[j]>=l[j+k])L=false}if(H)pH.push([j,h[j]]);if(L)pL.push([j,l[j]])}
  return{n,K,c,e9,e21,r,ml,ms,a14,st,mid,up,lo,pH,pL};
}
function run(P,o){
  const{n,K,c,e9,e21,r,ml,ms,a14,st,mid,up,lo,pH,pL}=P,T=[];let pa=0,pb=0,i=100;
  while(i<n-2){
    while(pa<pH.length&&pH[pa][0]<=i-5)pa++;while(pb<pL.length&&pL[pb][0]<=i-5)pb++;
    const p0=c[i],a=a14[i];let res=Infinity,sup=-Infinity;
    for(let k=pa-1;k>=0&&pH[k][0]>=i-150;k--){const v=pH[k][1];if(v>p0&&v<res)res=v}
    for(let k=pb-1;k>=0&&pL[k][0]>=i-150;k--){const v=pL[k][1];if(v<p0&&v>sup)sup=v}
    const v=[e9[i]>e21[i]?1:-1,r[i]>50&&r[i]<70?1:r[i]<50&&r[i]>30?-1:0,ml[i]-ms[i]>0?1:-1,st[i],p0>mid[i]&&p0<up[i]?1:p0<mid[i]&&p0>lo[i]?-1:0,p0-sup<0.5*a?1:res-p0<0.5*a?-1:0];
    const bu=v.filter(x=>x>0).length,be=v.filter(x=>x<0).length;
    const d=bu>=o.minV&&bu>=be+2?1:be>=o.minV&&be>=bu+2?-1:0;
    if(!d||(o.noCounter&&st[i]!==d)){i++;continue}
    const entry=K[i+1].o,risk=1.5*a,lev=0.01/(risk/entry);
    if(lev>o.maxLev){i++;continue}
    const rr=o.rr==="auto"?(st[i]===d&&Math.abs(e9[i]-e21[i])>0.5*a?2.5:2):+o.rr;
    const sl=entry-d*risk,tp=entry+d*risk*rr,end=Math.min(i+96,n-1);
    let ex=null,j=i+1;
    for(;j<=end;j++){const hit=d===1?K[j].l<=sl:K[j].h>=sl,tph=d===1?K[j].h>=tp:K[j].l<=tp;if(hit){ex=sl;break}if(tph){ex=tp;break}}
    if(ex===null){j=end;ex=K[end].c}
    const R=(ex-entry)*d/risk-(o.fee*2*entry)/risk;
    T.push({i,R,lev,d});i=j+1;
  }
  return T;
}
function stats(T){
  let eq=1,pk=1,dd=0,w=0,gp=0,gl=0,sr=0,sk=0,ms=0,sl=0,mx=0;
  for(const t of T){eq*=1+0.01*t.R;pk=Math.max(pk,eq);dd=Math.max(dd,(pk-eq)/pk);sr+=t.R;sl+=t.lev;mx=Math.max(mx,t.lev);if(t.R>0){w++;gp+=t.R;sk=0}else{gl-=t.R;sk++;ms=Math.max(ms,sk)}}
  const n=T.length;
  return{n,win:n?w/n:0,ret:eq-1,dd,pf:gl?gp/gl:(gp?99:0),avgR:n?sr/n:0,streak:ms,avgLev:n?sl/n:0,maxLev:mx};
}
//ENDPURE
const $=s=>document.querySelector(s);
const cache={};
const pc=x=>(x*100).toFixed(1)+"%";
async function fetchK(sym,months,prog){
  const key=sym+months;if(cache[key])return cache[key];
  const end=Date.now(),all=[];let t=end-months*30.4*864e5;
  while(t<end){
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=15m&startTime=${Math.floor(t)}&limit=1000`);
    const d=await r.json();if(!Array.isArray(d)||!d.length)break;
    for(const x of d)all.push({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]});
    t=d[d.length-1][0]+900000;prog(all.length);if(d.length<1000)break;
  }
  if(all.length&&all[all.length-1].t+900000>Date.now())all.pop();
  cache[key]=all;return all;
}
function card(title,s){
  const rc=s.ret>=0?"p":"m";
  return `<div class="card"><h3>${title}</h3><div class="g">
  <div><small>মোট ট্রেড</small><b>${s.n}</b></div><div><small>উইন রেট</small><b>${pc(s.win)}</b></div><div><small>মোট রিটার্ন</small><b class="${rc}">${pc(s.ret)}</b></div>
  <div><small>সর্বোচ্চ ড্রডাউন</small><b class="m">${pc(s.dd)}</b></div><div><small>প্রফিট ফ্যাক্টর</small><b>${s.pf.toFixed(2)}</b></div><div><small>গড় লাভ (R)</small><b class="${s.avgR>=0?"p":"m"}">${s.avgR.toFixed(2)}</b></div>
  <div><small>টানা সর্বোচ্চ হার</small><b>${s.streak}</b></div><div><small>গড় লিভারেজ</small><b>${s.avgLev.toFixed(1)}x</b></div><div><small>সর্বোচ্চ লিভারেজ</small><b>${s.maxLev.toFixed(1)}x</b></div></div></div>`;
}
$("#go").onclick=async()=>{
  const btn=$("#go"),msg=$("#msg"),out=$("#out");btn.disabled=true;out.innerHTML="";
  try{
    const sym=$("#sym").value,months=+$("#per").value;
    msg.textContent="ডেটা আনা হচ্ছে…";
    const K=await fetchK(sym,months,n=>msg.textContent=`ডেটা আনা হচ্ছে… ${n} ক্যান্ডেল`);
    if(K.length<500)throw new Error("কম ডেটা এসেছে");
    msg.textContent="হিসাব চলছে…";await new Promise(r=>setTimeout(r,30));
    const P=prep(K),base={rr:$("#rr").value,maxLev:+$("#lev").value||5,fee:(+$("#fee").value||0)/100,noCounter:$("#nc").checked};
    const sel=+$("#minv").value,T=run(P,{...base,minV:sel}),cut=K.length*0.7;
    const a=stats(T),tr=stats(T.filter(t=>t.i<cut)),te=stats(T.filter(t=>t.i>=cut));
    let rows="";
    for(const m of [3,4,5]){const s=stats(run(P,{...base,minV:m}));rows+=`<tr><td>${m}+</td><td>${s.n}</td><td>${pc(s.win)}</td><td class="${s.ret>=0?"p":"m"}">${pc(s.ret)}</td><td>${pc(s.dd)}</td><td>${s.pf.toFixed(2)}</td></tr>`}
    const ok=te.n>=20&&te.ret>0&&te.pf>1.2;
    const verdict=te.n<20?"যাচাই অংশে ট্রেড খুব কম, কোনো সিদ্ধান্ত নেওয়া যাবে না।":ok?"যাচাই অংশেও লাভ দেখা গেছে। এটা ভালো লক্ষণ, তবে এখনও আসল টাকার জন্য যথেষ্ট প্রমাণ নয়।":"যাচাই অংশে এই নিয়ম লাভজনক নয়। এই সেটিংসে আসল টাকায় ট্রেড করা ঠিক হবে না।";
    out.innerHTML=`<div class="card"><h3>সারসংক্ষেপ</h3><div>${verdict}</div><div class="note">${K.length} ক্যান্ডেল · যাচাই অংশ = শেষ ৩০% সময়, যেটা নিয়ম বানানোর সময় ব্যবহার হয়নি।</div></div>`
      +card(`সব সময় (${sel}+ মিল)`,a)+card("প্রথম ৭০% (শেখার অংশ)",tr)+card("শেষ ৩০% (যাচাইয়ের অংশ)",te)
      +`<div class="card"><h3>মিলের সংখ্যা ধরে তুলনা</h3><table><tr><th>মিল</th><th>ট্রেড</th><th>উইন</th><th>রিটার্ন</th><th>ড্রডাউন</th><th>PF</th></tr>${rows}</table></div>`;
    msg.textContent="শেষ";
  }catch(e){msg.textContent="এরর: "+(e.message||"ডেটা আনা যায়নি। ইন্টারনেট বা Binance অ্যাক্সেস দেখুন।")}
  btn.disabled=false;
};
</script>
</body>
</html>
